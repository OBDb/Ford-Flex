generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2009
    end_year: 2012
    description: "The Ford Flex debuted as an all-new full-size crossover SUV with distinctive boxy, retro-modern styling inspired by the 2005 Fairlane concept. Built on Ford's D4 platform shared with the Lincoln MKT and sharing its unibody construction with the Ford Edge, the Flex offered three-row seating for up to seven passengers with exceptional interior space and cargo flexibility. Initial models featured a 3.5L Duratec V6 producing 262 horsepower paired with a six-speed automatic transmission. In 2010, Ford introduced the powerful twin-turbocharged 3.5L EcoBoost V6 option producing 355 horsepower, transforming the Flex into a surprisingly quick family hauler. Available in SE, SEL, and Limited trim levels, with front-wheel drive standard and all-wheel drive optional on SEL and Limited trims. The special Titanium edition was offered in 2011-2012, featuring blacked-out exterior styling elements including headlights, taillights, grille, and trim, along with unique Alcantara suede and leather interior appointments and exclusive colors. Notable features included available refrigerated second-row console, Sony premium audio, panoramic vista roof with MyFord Touch controls, and innovative storage solutions throughout the cabin."

  - name: "First Generation (Post-Facelift)"
    start_year: 2013
    end_year: 2019
    description: "The 2013 model year brought a comprehensive mid-cycle refresh to the Ford Flex with a bold new face featuring the word 'FLEX' spelled across the hood brow, a single-bar upper grille design replacing the traditional Ford blue oval and three-bar grille, and redesigned headlights. The interior received significant updates including new instrument clusters, steering wheel, seats with improved foam and trim, and the latest MyFord Touch infotainment system with dual 4.2-inch instrument cluster displays and an 8-inch center touchscreen. Mechanical improvements included a more powerful base 3.5L V6 (287 horsepower, up from 262), electric power-assisted steering replacing the hydraulic system, larger front brake rotors, retuned suspension, and paddle shifters mounted on the steering wheel. The EcoBoost V6 was upgraded to 365 horsepower and became exclusively available on the Limited trim with premium equipment packages. New technology features included adaptive cruise control, active park assist, blind-spot monitoring with cross-traffic alert, inflatable rear seatbelts, ventilated front seats, and keyless ignition with push-button start. Production continued through 2019 with minimal changes in later years, as Ford shifted focus toward SUVs and away from car-based crossovers. The Flex's discontinuation marked the end of one of Ford's most distinctive and functional people movers, with its combination of retro styling, exceptional interior space, and surprising performance capability earning it a devoted following."
